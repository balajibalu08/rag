readme = "README.md"
authors = [
    { name = "balajibalu08", email = "balajibalu088@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.21.0",
    "docling>=2.138.0",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-ollama>=0.3.10",
    "pandas>=3.0.6",
    "ruff>=0.17.0",
    "streamlit>=1.65.0",
